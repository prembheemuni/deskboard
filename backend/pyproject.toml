[project]
name = "deskboard-backend"
version = "0.1.0"
description = "Local API that reads and writes the Obsidian vault for Deskboard"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
